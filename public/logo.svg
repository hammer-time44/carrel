<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2b36;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121214;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b8cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#grad1)" filter="url(#shadow)" stroke="#333338" stroke-width="4"/>

  <!-- Color-coded Quadrants representing Document Tabs -->
  <!-- Top Left: Blue (Word DOCX) -->
  <path d="M 120 120 L 240 120 C 248 120 252 124 252 132 L 252 244 L 120 244 Z" fill="#5b6cf0" rx="12"/>
  
  <!-- Top Right: Green (Spreadsheets XLSX) -->
  <path d="M 264 120 L 384 120 C 392 120 396 124 396 132 L 396 244 L 264 244 Z" fill="#3f8a57" rx="12"/>

  <!-- Bottom Left: Orange (Presentations PPTX) -->
  <path d="M 120 256 L 252 256 L 252 384 C 252 392 248 396 240 396 L 120 396 Z" fill="#c9682f" rx="12"/>

  <!-- Bottom Right: Teal/Ruby (PDF Reader) -->
  <path d="M 264 256 L 396 256 L 396 384 C 396 392 392 396 384 396 L 264 396 Z" fill="#5bbfb0" rx="12"/>

  <!-- Center White Star / Prism representing Focused Unified Workspace -->
  <circle cx="258" cy="250" r="28" fill="#ffffff" filter="url(#shadow)"/>
</svg>

